{% extends 'base.html' %}{% block title %}Обрані{% endblock %}{% block content %}<div class="title"><small>ШВИДКІ ПЛАТЕЖІ</small><h1>Обрані отримувачі</h1></div><div class="columns"><section class="panel">{% for f in favorites %}<div class="tx"><em>★</em><div><b>{{f.name}}</b><small>**** {{f.card_number|slice:'-4:'}}</small></div><a href="/favorites/delete/{{f.id}}/">Видалити</a></div>{% empty %}<div class="empty">Список порожній.</div>{% endfor %}</section><section class="form"><h2>Додати</h2><form method="post" action="/favorites/add/">{% csrf_token %}<label>Назва</label><input name="name" placeholder="Мама" required><label>Номер картки</label><input class="cardinput" name="card_number" maxlength="19" placeholder="0000 0000 0000 0000" required><button class="btn full">＋ Додати</button></form></section></div>{% endblock %}
