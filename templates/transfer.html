{% extends 'base.html' %}{% block title %}Переказ{% endblock %}{% block content %}<div class="title"><small>ПЛАТЕЖІ</small><h1>Переказ коштів</h1><p>Надішліть кошти на іншу картку MyBank.</p></div><section class="form"><p>Доступно: <b>{{account.balance|floatformat:2}} UAH</b></p><form method="post">{% csrf_token %}<label>Номер картки</label><input class="cardinput" name="card_number" maxlength="19" placeholder="0000 0000 0000 0000" required>{% if favorites %}<label>Обрані</label><div class="quick">{% for f in favorites %}<button type="button" onclick="setCard('{{f.card_number}}')">{{f.name}} · ****{{f.card_number|slice:'-4:'}}</button>{% endfor %}</div>{% endif %}<label>Сума</label><input name="amount" type="number" step="0.01" placeholder="0.00" required><label>Коментар</label><input name="description" maxlength="255" placeholder="Наприклад: за вечерю"><button class="btn full">↗ Виконати переказ</button></form></section>{% endblock %}
