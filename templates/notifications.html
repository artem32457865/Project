{% extends 'base.html' %}{% block title %}Сповіщення{% endblock %}{% block content %}<div class="title"><small>ЦЕНТР СПОВІЩЕНЬ</small><h1>Сповіщення</h1></div><section class="panel">{% for n in notifications %}<div class="notification"><b>●</b><div><strong>{{n.title}}</strong><span>{{n.message}}</span><small>{{n.created_at|date:'d.m.Y H:i'}}</small></div></div>{% empty %}<div class="empty">Сповіщень немає.</div>{% endfor %}</section>{% endblock %}
